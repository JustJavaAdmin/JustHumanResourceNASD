name: build-JustHumanResource

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Verify build with Maven
        run: mvn -B clean test

  build-and-push:
    name: Build and push to Docker Hub
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build and Push with Jib
        run: |
          mvn -B clean package jib:build \
            -DskipTests \
            -Djib.to.image=kazeemakinrinde/justhumanresource:latest \
            -Djib.to.auth.username=${{ secrets.DOCKER_USERNAME }} \
            -Djib.to.auth.password=${{ secrets.DOCKER_PASSWORD }}

  deploy:
    name: Deploy to DigitalOcean Droplet
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy to Droplet via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DO_SPACES_KEY: ${{ secrets.DO_SPACES_KEY }}
          DO_SPACES_SECRET: ${{ secrets.DO_SPACES_SECRET }}
          DO_SPACES_REGION: ${{ secrets.DO_SPACES_REGION }}
          DO_SPACES_BUCKET: ${{ secrets.DO_SPACES_BUCKET }}
        with:
          host: ${{ secrets.DO_DROPLET_IP }}
          username: ${{ secrets.DO_DROPLET_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          envs: DO_SPACES_KEY,DO_SPACES_SECRET,DO_SPACES_REGION,DO_SPACES_BUCKET
          script: |
            # Pull latest image from Docker Hub
            docker pull kazeemakinrinde/justhumanresource:latest
            
            # Stop and remove existing container
            docker stop justhr || true
            docker rm justhr || true

            # Run container with environment variables and SSL volume mount
            docker run -d \
              --name justhr \
              --restart unless-stopped \
              -p 8080:8080 \
              --env-file .env \
              -e DO_SPACES_KEY="$DO_SPACES_KEY" \
              -e DO_SPACES_SECRET="$DO_SPACES_SECRET" \
              -e DO_SPACES_REGION="$DO_SPACES_REGION" \
              -e DO_SPACES_BUCKET="$DO_SPACES_BUCKET" \
              -v /etc/ssl/certs/do-ca-certificate.crt:/app/certs/ca-certificate.crt \
              kazeemakinrinde/justhumanresource:latest

            # Prune unused images to save disk space
            docker image prune -f
